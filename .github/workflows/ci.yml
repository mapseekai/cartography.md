name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to validate
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm schema:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @mapseekai/cartography.md check-package
      - run: pnpm lint:example
      - name: Typecheck data-profile Skill
        run: pnpm typecheck:data-profile
      - name: Test data-profile Skill
        run: pnpm test:data-profile
      - name: Typecheck cartography-init skill
        run: pnpm --filter @cartographymd/init-skill typecheck

      - name: Run cartography-init skill tests
        run: pnpm --filter @cartographymd/init-skill test
