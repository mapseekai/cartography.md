name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed Git tag to verify
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      TRIGGER_SHA: ${{ github.sha }}
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Resolve immutable release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Manual verification must be dispatched from refs/heads/$DEFAULT_BRANCH." >&2
            exit 1
          fi

          helper="$RUNNER_TEMP/release-metadata.mjs"
          metadata="$RUNNER_TEMP/release-metadata.out"
          cp scripts/release-metadata.mjs "$helper"
          git fetch --force --tags origin
          sha="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
          if [ "$EVENT_NAME" = "push" ] && [ "$sha" != "$TRIGGER_SHA" ]; then
            echo "Tag $REQUESTED_TAG resolves to $sha, not push SHA $TRIGGER_SHA." >&2
            exit 1
          fi

          git checkout --detach "$sha"
          node "$helper" "$REQUESTED_TAG" > "$metadata"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          cat "$metadata" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      NPM_TAG: ${{ needs.resolve.outputs.npm_tag }}
      REMOTE_URL: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Pin npm release client
        run: npm install --global npm@12.0.2
      - name: Install and build publishable package
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Recheck release tag before packaging
        shell: bash
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --tags "$REMOTE_URL" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_sha="$(printf '%s\n' "$remote_refs" | awk '$2 ~ /\^\{\}$/ {peeled=$1} END {if (peeled != "") print peeled; else if (NR == 1) print $1}')"
          if [ -z "$remote_sha" ]; then
            echo "Remote tag $RELEASE_TAG does not exist." >&2
            exit 1
          fi
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "Remote tag $RELEASE_TAG moved from $RELEASE_SHA to $remote_sha." >&2
            exit 1
          fi
      - name: Pack publishable tarball once
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$RUNNER_TEMP/npm-pack.json"
          pack_fields_file="$RUNNER_TEMP/npm-pack.fields"
          npm pack ./packages/cli --json --pack-destination "$RUNNER_TEMP" > "$pack_json"
          node -e '
            const fs = require("node:fs");
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const results = Array.isArray(parsed)
              ? parsed
              : parsed && typeof parsed === "object"
                ? Object.values(parsed)
                : [];
            if (results.length !== 1) {
              throw new Error("npm pack --json must contain exactly one package result; found " + results.length + ".");
            }
            const [item] = results;
            if (
              !item ||
              typeof item !== "object" ||
              typeof item.filename !== "string" ||
              typeof item.integrity !== "string"
            ) {
              throw new Error("npm pack --json result must contain string filename and integrity fields.");
            }
            process.stdout.write(item.filename + "\n" + item.integrity + "\n");
          ' "$pack_json" > "$pack_fields_file"
          pack_field_count="$(wc -l < "$pack_fields_file" | tr -d ' ')"
          if [ "$pack_field_count" -ne 2 ]; then
            echo "npm pack did not report exactly one tarball and integrity." >&2
            exit 1
          fi
          tarball_name="$(sed -n '1p' "$pack_fields_file")"
          local_integrity="$(sed -n '2p' "$pack_fields_file")"
          if [ -z "$tarball_name" ] || [ -z "$local_integrity" ]; then
            echo "npm pack did not report a tarball and integrity." >&2
            exit 1
          fi
          case "$tarball_name" in
            */*|*..*)
              echo "npm pack returned an unsafe tarball name: $tarball_name" >&2
              exit 1
              ;;
          esac
          tarball="$RUNNER_TEMP/package.tgz"
          mv "$RUNNER_TEMP/$tarball_name" "$tarball"
          printf '%s\n' "$local_integrity" > "$RUNNER_TEMP/package.integrity"
      - name: Validate packed tarball contract
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/package.tgz"
          tar_manifest="$RUNNER_TEMP/package-files.txt"
          tar_package_json="$RUNNER_TEMP/tar-package.json"
          tar_cli="$RUNNER_TEMP/tar-cli.js"
          tar_version="$RUNNER_TEMP/tar-version.js"
          tar -tzf "$tarball" > "$tar_manifest"
          node -e '
            const fs = require("node:fs");
            const entries = fs.readFileSync(process.argv[1], "utf8").trimEnd().split(/\r?\n/).filter(Boolean);
            if (entries.some((entry) => !entry.startsWith("package/"))) {
              throw new Error("Tarball contains an entry outside package/.");
            }
            const files = entries.map((entry) => entry.slice("package/".length));
            const publishableSet = new Set(files);
            const required = [
              "LICENSE",
              "README.md",
              "dist/api.js",
              "dist/api.d.ts",
              "dist/cli.js",
              "dist/spec.md",
              "dist/schema-json/cartography-front-matter.schema.json",
              "dist/version.js",
              "package.json",
            ];
            for (const relative of required) {
              if (!publishableSet.has(relative)) throw new Error("Required tarball file is missing: " + relative);
            }
            const schemaFiles = files.filter(
              (relative) => relative.startsWith("dist/schema-json/") && relative !== "dist/schema-json/",
            );
            if (schemaFiles.length !== 1 || schemaFiles[0] !== "dist/schema-json/cartography-front-matter.schema.json") {
              throw new Error(
                "dist/schema-json must contain only cartography-front-matter.schema.json; found " +
                  (schemaFiles.join(", ") || "(empty)"),
              );
            }
            const staleArtifacts = files.filter(
              (relative) =>
                relative.startsWith("dist/") &&
                /(?:^|\/)(?:data-profile|profile|style)(?:\.|\/|$)/.test(relative),
            );
            if (staleArtifacts.length > 0) {
              throw new Error("Publishable stale 0.1 artifacts found: " + staleArtifacts.join(", ") + ".");
            }
          ' "$tar_manifest"
          tar -xOzf "$tarball" package/package.json > "$tar_package_json"
          tar -xOzf "$tarball" package/dist/cli.js > "$tar_cli"
          tar -xOzf "$tarball" package/dist/version.js > "$tar_version"
          IFS= read -r cli_first_line < "$tar_cli"
          if [ "$cli_first_line" != '#!/usr/bin/env node' ]; then
            echo "dist/cli.js is missing its executable shebang." >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const rootManifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const cliManifest = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
            const compiledSource = fs.readFileSync(process.argv[4], "utf8");
            const releaseVersion = process.argv[5];
            const compiledMatch = /^\s*export\s+const\s+VERSION\s*=\s*(["\x27])([^"\x27\\\r\n]+)\1;\s*(?:\/\/# sourceMappingURL=version\.js\.map\s*)?$/.exec(compiledSource);
            const compiledVersion = compiledMatch?.[2];
            if (compiledVersion !== releaseVersion) {
              throw new Error(
                "dist/version.js must export a literal VERSION equal to RELEASE_VERSION; found " +
                  (compiledVersion ?? "(missing or non-literal)") + ".",
              );
            }
            if (manifest.name !== "@mapseekai/cartography.md" || cliManifest.name !== manifest.name) {
              throw new Error("Tarball package name does not match @mapseekai/cartography.md.");
            }
            if (
              manifest.version !== releaseVersion ||
              rootManifest.version !== releaseVersion ||
              cliManifest.version !== releaseVersion
            ) {
              throw new Error(
                "Version mismatch: release " + releaseVersion + ", root " + rootManifest.version +
                  ", CLI " + cliManifest.version + ", tarball " + manifest.version + ".",
              );
            }
            const bin = manifest.bin ?? {};
            const binKeys = Object.keys(bin).sort();
            if (
              binKeys.length !== 2 ||
              binKeys[0] !== "cartography.md" ||
              binKeys[1] !== "cartographymd" ||
              bin["cartography.md"] !== "./dist/cli.js" ||
              bin.cartographymd !== "./dist/cli.js"
            ) {
              throw new Error("Tarball bin contract must expose cartography.md and cartographymd at ./dist/cli.js.");
            }
          ' "$tar_package_json" package.json packages/cli/package.json "$tar_version" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/package.tgz
            ${{ runner.temp }}/package.integrity
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      NPM_TAG: ${{ needs.resolve.outputs.npm_tag }}
      PACKAGE_NAME: '@mapseekai/cartography.md'
      REMOTE_URL: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Pin npm release client
        run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Verify artifact and release tag
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/npm-package/package.tgz"
          integrity_file="$RUNNER_TEMP/npm-package/package.integrity"
          local_integrity="$(tr -d '\r\n' < "$integrity_file")"
          computed_integrity="$(node -e 'const crypto=require("node:crypto"); const fs=require("node:fs"); process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
          if [ "$computed_integrity" != "$local_integrity" ]; then
            echo "Artifact integrity does not match package.integrity." >&2
            exit 1
          fi

          remote_refs="$(git ls-remote --tags "$REMOTE_URL" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_sha="$(printf '%s\n' "$remote_refs" | awk '$2 ~ /\^\{\}$/ {peeled=$1} END {if (peeled != "") print peeled; else if (NR == 1) print $1}')"
          if [ -z "$remote_sha" ]; then
            echo "Remote tag $RELEASE_TAG does not exist." >&2
            exit 1
          fi
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "Remote tag $RELEASE_TAG moved from $RELEASE_SHA to $remote_sha." >&2
            exit 1
          fi
      - name: Publish through npm Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/npm-package/package.tgz"
          local_integrity="$(tr -d '\r\n' < "$RUNNER_TEMP/npm-package/package.integrity")"
          package_spec="${PACKAGE_NAME}@${RELEASE_VERSION}"

          lookup_registry_integrity() {
            local cache="$1"
            local error_file="$2"
            local lookup_status
            registry_integrity=""
            if registry_integrity="$(npm view "$package_spec" dist.integrity --prefer-online --cache "$cache" 2>"$error_file")"; then
              registry_integrity="$(printf '%s' "$registry_integrity" | tr -d '\r\n')"
              if [ -z "$registry_integrity" ]; then
                echo "npm view returned an empty dist.integrity for $package_spec without a 404." >&2
                return 2
              fi
              return 0
            else
              lookup_status=$?
              if grep -Eq '(^|[[:space:]])E404([[:space:]]|$)|404 Not Found' "$error_file"; then
                return 4
              fi
              cat "$error_file" >&2
              return "$lookup_status"
            fi
          }

          registry_state="absent"
          for lookup_attempt in $(seq 1 3); do
            if lookup_registry_integrity \
              "$RUNNER_TEMP/npm-existing-$lookup_attempt" \
              "$RUNNER_TEMP/npm-existing-$lookup_attempt.err"; then
              registry_state="present"
              break
            else
              lookup_status=$?
              if [ "$lookup_status" -ne 4 ]; then
                exit "$lookup_status"
              fi
            fi
            if [ "$lookup_attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          if [ "$registry_state" = "present" ]; then
            if [ "$registry_integrity" = "$local_integrity" ]; then
              echo "$package_spec already exists with the exact tarball; dry-run and upload skipped."
              exit 0
            fi
            echo "Registry integrity collision for $package_spec: expected $local_integrity, found $registry_integrity." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" != "push" ]; then
            echo "Manual dispatch can only verify an already-published exact-integrity version; $package_spec is absent." >&2
            exit 1
          fi

          npm publish "$tarball" --dry-run --access public --tag "$NPM_TAG"

          set +e
          output="$(npm publish "$tarball" --access public --tag "$NPM_TAG" --provenance 2>&1)"
          publish_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$publish_status" -ne 0 ]; then
            for race_attempt in $(seq 1 6); do
              cache="$RUNNER_TEMP/npm-publish-race-$race_attempt"
              if lookup_registry_integrity "$cache" "$cache.err"; then
                if [ "$registry_integrity" = "$local_integrity" ]; then
                  echo "$package_spec appeared with the exact tarball after the publish race."
                  exit 0
                fi
                echo "Registry integrity collision for $package_spec: expected $local_integrity, found $registry_integrity." >&2
                exit 1
              else
                lookup_status=$?
                if [ "$lookup_status" -ne 4 ]; then
                  break
                fi
              fi
              if [ "$race_attempt" -lt 6 ]; then
                sleep 5
              fi
            done
            echo "Publish failed and registry did not expose matching integrity for $package_spec." >&2
            exit "$publish_status"
          fi
      - name: Verify public registry and installed CLI
        shell: bash
        run: |
          set -euo pipefail
          local_integrity="$(tr -d '\r\n' < "$RUNNER_TEMP/npm-package/package.integrity")"
          package_spec="${PACKAGE_NAME}@${RELEASE_VERSION}"
          for attempt in $(seq 1 18); do
            cache="$RUNNER_TEMP/npm-registry-$attempt"
            registry_integrity="$(npm view "$package_spec" dist.integrity --prefer-online --cache "$cache" 2>/dev/null || true)"
            if [ "$registry_integrity" = "$local_integrity" ]; then
              if cli_version="$(npx --yes --cache "$RUNNER_TEMP/npm-cli-$attempt" --package="$package_spec" cartographymd --version 2>/dev/null)"; then
                if [ "$cli_version" = "$RELEASE_VERSION" ]; then
                  exit 0
                fi
              fi
            elif [ -n "$registry_integrity" ]; then
              echo "Registry integrity collision for $package_spec: expected $local_integrity, found $registry_integrity." >&2
              exit 1
            fi
            sleep 10
          done
          echo "npm registry did not expose an installable exact tarball for $package_spec within 180 seconds." >&2
          exit 1

  release:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      REMOTE_URL: https://github.com/${{ github.repository }}.git
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Recheck release tag before GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --tags "$REMOTE_URL" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_sha="$(printf '%s\n' "$remote_refs" | awk '$2 ~ /\^\{\}$/ {peeled=$1} END {if (peeled != "") print peeled; else if (NR == 1) print $1}')"
          if [ -z "$remote_sha" ]; then
            echo "Remote tag $RELEASE_TAG does not exist." >&2
            exit 1
          fi
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "Remote tag $RELEASE_TAG moved from $RELEASE_SHA to $remote_sha." >&2
            exit 1
          fi
      - name: Create GitHub Release if absent
        shell: bash
        run: |
          set -euo pipefail
          release_error="$RUNNER_TEMP/github-release-view.err"
          if release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName, (.isDraft | tostring), (.isPrerelease | tostring)] | @tsv' \
            2>"$release_error")"; then
            IFS=$'\t' read -r existing_tag existing_draft existing_prerelease <<< "$release_state"
            metadata_mismatch=0
            if [ "$existing_tag" != "$RELEASE_TAG" ]; then
              echo "Existing GitHub Release tagName mismatch: expected $RELEASE_TAG, found ${existing_tag:-<empty>}." >&2
              metadata_mismatch=1
            fi
            if [ "$existing_draft" != "false" ]; then
              echo "Existing GitHub Release isDraft mismatch: expected false, found ${existing_draft:-<empty>}." >&2
              metadata_mismatch=1
            fi
            if [ "$existing_prerelease" != "$PRERELEASE" ]; then
              echo "Existing GitHub Release isPrerelease mismatch: expected $PRERELEASE, found ${existing_prerelease:-<empty>}." >&2
              metadata_mismatch=1
            fi
            if [ "$metadata_mismatch" -ne 0 ]; then
              exit 1
            fi
            echo "GitHub Release $RELEASE_TAG already exists with matching immutable metadata; creation skipped."
            exit 0
          else
            view_status=$?
            if ! grep -qi 'release not found' "$release_error"; then
              cat "$release_error" >&2
              exit "$view_status"
            fi
          fi
          args=(release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --generate-notes --title "cartography.md $RELEASE_TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
