name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed Git tag to publish or verify
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Resolve immutable release metadata
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/release-metadata.mjs"
          cp scripts/release-metadata.mjs "$helper"
          git fetch --force --tags origin
          sha="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          node "$helper" "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      NPM_TAG: ${{ needs.resolve.outputs.npm_tag }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      PACKAGE_NAME: '@mapseekai/cartography.md'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Pin npm release client
        run: npm install --global npm@12.0.2
      - name: Install and build publishable package
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @mapseekai/cartography.md check-package
          npm publish ./packages/cli --dry-run --access public --tag "$NPM_TAG"
      - name: Publish through npm Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          package_spec="${PACKAGE_NAME}@${RELEASE_VERSION}"
          if npm view "$package_spec" version --prefer-online >/dev/null 2>&1; then
            echo "$package_spec already exists; upload skipped."
            exit 0
          fi
          set +e
          output="$(npm publish ./packages/cli --access public --tag "$NPM_TAG" --provenance 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && ! grep -Eq 'previously published|cannot publish over|E403' <<<"$output"; then
            exit "$status"
          fi
      - name: Verify public registry and installed CLI
        shell: bash
        run: |
          set -euo pipefail
          package_spec="${PACKAGE_NAME}@${RELEASE_VERSION}"
          for attempt in $(seq 1 18); do
            cache="$RUNNER_TEMP/npm-registry-$attempt"
            published="$(npm view "$package_spec" version --prefer-online --cache "$cache" 2>/dev/null || true)"
            if [ "$published" = "$RELEASE_VERSION" ]; then
              cli_version="$(npx --yes --cache "$RUNNER_TEMP/npm-cli-$attempt" --package="$package_spec" cartographymd --version)"
              if [ "$cli_version" = "$RELEASE_VERSION" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "npm registry did not expose an installable $package_spec within 180 seconds." >&2
          exit 1
      - name: Create GitHub Release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; creation skipped."
            exit 0
          fi
          args=(release create "$RELEASE_TAG" --verify-tag --generate-notes --title "cartography.md $RELEASE_TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
